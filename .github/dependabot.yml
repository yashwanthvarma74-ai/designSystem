version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      storybook:
        patterns: ['storybook', '@storybook/*']
      testing:
        patterns: ['vitest', '@vitest/*', '@testing-library/*', 'vitest-axe', '@playwright/test']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
